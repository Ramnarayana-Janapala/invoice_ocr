[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paddleocr-app"
version = "0.1.0"
description = "OCR application with PaddleOCR and Ollama integration for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "you@example.com"}
]

dependencies = [
    "paddleocr>=2.7.0.3",
    "paddlepaddle>=2.6.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.0.0",
]

[project.scripts]
paddleocr-app = "paddleocr_app.cli:main"
ocr-integration = "paddleocr_app.ocr_ollama_integration:main"




[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.mypy]
python_version = "311"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=paddleocr_app --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["src/paddleocr_app"]