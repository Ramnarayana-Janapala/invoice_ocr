version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - app_network

  app:
    build: .
    container_name: paddleocr-app
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama
      - OLLAMA_PORT=11434
      - OCR_LANGUAGE=en
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: process --image /app/data/input/sample.jpg
    networks:
      - app_network

volumes:
  ollama_data:

networks:
  app_network:
    driver: bridge
